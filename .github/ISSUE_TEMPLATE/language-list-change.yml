# Generated by tools/generate_issue_form.js - edit language-lists/catalog.json instead.
name: Language list change
description: Request a change to the languages offered for a country in your product.
title: "[language-list] "
labels: ["language-list-request"]
body:
  - type: markdown
    attributes:
      value: |
        Only people listed for the product in `language-lists/owners.json` can request changes.
        A bot validates the request and opens a pull request; a platform maintainer reviews and merges it.
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - "aurora"
        - "nimbus"
    validations:
      required: true
  - type: checkboxes
    id: environments
    attributes:
      label: Environments
      options:
        - label: dev
        - label: staging
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Change
      options:
        - "Set languages for a country"
        - "Remove a country"
    validations:
      required: true
  - type: dropdown
    id: country
    attributes:
      label: Country
      options:
        - "CA - Canada"
        - "DE - Germany"
        - "ES - Spain"
        - "FR - France"
        - "IT - Italy"
        - "MX - Mexico"
        - "NL - Netherlands"
        - "US - United States"
    validations:
      required: true
  - type: dropdown
    id: locales
    attributes:
      label: Locales
      description: Required for "Set languages". Pick every language the country should offer.
      multiple: true
      options:
        - "de-DE - German (Germany)"
        - "en-US - English (United States)"
        - "es-ES - Spanish (Spain)"
        - "es-US - Spanish (United States)"
        - "fr-CA - French (Canada)"
        - "fr-FR - French (France)"
        - "it-IT - Italian (Italy)"
        - "nl-NL - Dutch (Netherlands)"
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why is this change needed?
    validations:
      required: false

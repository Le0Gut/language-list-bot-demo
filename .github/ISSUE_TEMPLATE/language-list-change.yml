# Generated by tools/generate_issue_form.js - edit owners.json or environments/*/values.yaml instead.
name: Language list change
description: Request a change to the languages offered for a country in your product.
title: "[language-list] "
labels: ["language-list-request"]
body:
  - type: markdown
    attributes:
      value: |
        Only people listed for the product in `language-lists/owners.json` can request changes.
        A bot validates the request and opens a pull request; a platform maintainer reviews and merges it.
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - "aurora"
        - "nimbus"
    validations:
      required: true
  - type: checkboxes
    id: environments
    attributes:
      label: Environments
      description: Pick at least one.
      options:
        - label: dev
        - label: staging
  - type: dropdown
    id: change
    attributes:
      label: Change
      options:
        - "Add languages to a country"
        - "Remove languages from a country"
        - "Replace all languages for a country"
        - "Remove a country"
    validations:
      required: true
  - type: dropdown
    id: country
    attributes:
      label: Country
      options:
        - "CA (region NA)"
        - "DE (region EU)"
        - "ES (region EU)"
        - "FR (region EU)"
        - "IT (region EU)"
        - "MX (region NA)"
        - "NL (region EU)"
        - "US (region NA)"
    validations:
      required: true
  - type: dropdown
    id: locales
    attributes:
      label: Locales
      description: "Add: only the new languages (current ones are kept). Remove languages: only the ones to drop. Replace: the full list. Not needed for Remove a country."
      multiple: true
      options:
        - "de-DE - German (Germany)"
        - "en-GB - English (United Kingdom)"
        - "en-US - English (United States)"
        - "es-ES - Spanish (Spain)"
        - "es-MX - Spanish (Mexico)"
        - "es-US - Spanish (United States)"
        - "fr-CA - French (Canada)"
        - "fr-FR - French (France)"
        - "it-IT - Italian (Italy)"
        - "nl-NL - Dutch (Netherlands)"
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why is this change needed?
    validations:
      required: false

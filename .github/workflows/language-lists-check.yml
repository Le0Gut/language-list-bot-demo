name: Language lists check

on:
  pull_request:
    paths:
      - "environments/**"
      - "argocd/**"
      - "language-lists/**"
      - "scripts/**"
      - "tools/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: language-lists.json valid in every environment
        run: node tools/check_language_lists.js
      - name: Bot logic and form
        run: node tools/local_test.js
